<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<script>
  try {
    var _t = localStorage.getItem('sad-theme');
    if (_t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}
</script>
<title>Login — Acompanhamento de Demanda</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--accent:#f0a500;--text:#e6edf3;--text2:#8b949e;--red:#f85149;color-scheme:dark}
[data-theme="light"]{--bg:#f6f8fa;--surface:#fff;--surface2:#eaeef2;--border:#d0d7de;--accent:#d97706;--text:#1f2328;--text2:#656d76;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.theme-toggle-floating{position:fixed;top:16px;right:16px;background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:16px}
.theme-toggle-floating .icon-sun{display:none}[data-theme="light"] .theme-toggle-floating .icon-sun{display:inline}[data-theme="light"] .theme-toggle-floating .icon-moon{display:none}
.login-container{width:100%;max-width:420px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px 28px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.login-logo{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.login-mark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#f0a500,#ff6b35);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.login-logo-title{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
.login-logo-badge{background:var(--accent);font-family:'Space Mono',monospace;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:1px}
:root:not([data-theme="light"]) .login-logo-badge{color:#000}[data-theme="light"] .login-logo-badge{color:#fff}
.login-logo-sub{font-size:11px;color:var(--text2);margin-top:2px}
.login-divider{height:1px;background:var(--border);margin:0 0 20px}
.login-heading{font-size:20px;font-weight:600}.login-subheading{font-size:13px;color:var(--text2);margin:4px 0 18px}
.login-error{display:none;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:var(--red);font-size:12px;font-family:'Space Mono',monospace;border-radius:7px;padding:10px 12px;margin-bottom:14px}
.login-error.visible{display:block}
.login-field{margin-bottom:14px}.login-field label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.login-field input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:11px 12px;font-size:14px;outline:none}
.login-field input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:12px;background:linear-gradient(135deg,#f0a500,#ff6b35);border:none;border-radius:7px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:#0d1117}
[data-theme="light"] .login-btn{color:#fff}
.login-btn:disabled{opacity:.5}
.login-demo{margin-top:14px;font-size:11px;color:var(--text2);font-family:'Space Mono',monospace;line-height:1.8;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px}
.login-footer{margin-top:18px;text-align:center;font-size:11px;color:var(--text2);font-family:'Space Mono',monospace}
.login-footer span{color:var(--accent);font-weight:700}
</style>
</head>
<body>

<button class="theme-toggle-floating" data-theme-toggle aria-label="Alternar tema"><span class="icon-moon">🌙</span><span class="icon-sun">☀️</span></button>

<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-mark">⚡</div>
      <div>
        <div class="login-logo-title">ACOMPANHAMENTO DE DEMANDA <span class="login-logo-badge">ORION-PB</span></div>
        <div class="login-logo-sub">SIATE × LIST • quarentena + caixa principal</div>
      </div>
    </div>
    <div class="login-divider"></div>
    <div class="login-heading">Bem-vindo</div>
    <div class="login-subheading">Faça login com seu e-mail e senha de acesso</div>
    <div class="login-error" id="login-error"></div>
    <form id="login-form" onsubmit="return handleLogin(event)">
      <div class="login-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
      </div>
      <div class="login-field">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">Entrar</button>
    </form>
    <div class="login-demo">Demo local:<br>admin → admin@sistema / admin123<br>equipe → equipe@sistema / equipe123</div>
    <div class="login-footer">Feito por <span>Valdeci Nunes</span></div>
  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script>
  (async () => {
    const session = await getSession();
    if (session) window.location.href = 'index.html';
  })();
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-error');
    errEl.classList.remove('visible');
    btn.disabled = true; btn.textContent = 'Entrando...';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await signIn(email, password);
    if (error) {
      errEl.textContent = 'E-mail ou senha incorretos.';
      errEl.classList.add('visible');
      btn.disabled = false; btn.textContent = 'Entrar';
      return false;
    }
    window.location.href = 'index.html';
    return false;
  }
</script>
</body>
</html>
